name: Publish Package

on:
  push:
    branches:
      - main  # Trigger on every push to main
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ${{ fromJSON(vars.CI_RUNNER) }}
    steps:
      - name: Mark the start, so the reported duration is real
        run: echo "JOB_STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: WolffM/hadoku-actions/setup-pnpm@v1
        with:
          npm-token: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      - name: Configure npm for GitHub Packages
        run: |
          echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > ~/.npmrc
          echo "@wolffm:registry=https://npm.pkg.github.com" >> ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      - name: Install dependencies
        run: pnpm --config.store-dir=${{ runner.tool_cache }}/pnpm-store install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      - name: Build package
        run: pnpm run build

      # What this PUSH introduced, as a diff range.
      #
      # `HEAD~1 HEAD` is the last COMMIT, and a push is not one commit. Push
      # three commits where the source changes in the first and a chore lands
      # last, and the publish is silently skipped — a green run that shipped
      # nothing, because the gate, the version walk and the dispatch below all
      # read the same wrong answer and therefore agree with each other.
      #
      # `github.event.before` is the tip before the push, the only base that
      # covers every commit in it. hadoku-meet hit this on 2026-08-18 and
      # hadoku-hopper on 2026-09-01, where a two-commit push stranded
      # @wolffm/hopper-worker 0.1.8 and the site ran a new client against a
      # month-old worker. hadoku_site's check:repo-policy has held every fleet
      # publish workflow to this since 2026-09-02.
      - name: Resolve the range this push introduced
        id: range
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          # A manual dispatch is an explicit "publish now". It exists to recover
          # a publish that was skipped, so the change check must never veto it:
          # diffing HEAD~1 here would skip the same thing the stranded push
          # skipped, and the only way out would be a no-op commit.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Manual dispatch: publishing unconditionally"
            echo "publish_all=true" >> $GITHUB_OUTPUT
            echo "base=HEAD~1" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "publish_all=false" >> $GITHUB_OUTPUT

          base="$BEFORE"
          # A branch's first push sends the all-zero sha; a force-push can name
          # a commit that is no longer reachable. Fall back to the last commit
          # in both cases — a narrower range than the truth, but never a broken
          # one.
          if [ -z "$base" ] \
            || [ "$base" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "No usable push base ('$base'); falling back to HEAD~1"
            base="HEAD~1"
          fi
          echo "base=$base" >> $GITHUB_OUTPUT
          echo "Comparing ${base}..HEAD:"
          git diff --name-only "$base" HEAD

      - name: Check if package changed
        id: package_changed
        env:
          BASE: ${{ steps.range.outputs.base }}
          PUBLISH_ALL: ${{ steps.range.outputs.publish_all }}
        run: |
          if [ "$PUBLISH_ALL" = "true" ] || git diff --name-only "$BASE" HEAD | grep -q .; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✓ Package has changes"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "✗ No changes in package"
          fi

      - name: Check and bump version if needed
        if: steps.package_changed.outputs.changed == 'true'
        run: |
          # Get package name and current version from package.json
          package_name=$(node -p "require('./package.json').name")
          current_version=$(node -p "require('./package.json').version")
          echo "Current version: $current_version"

          # Function to calculate next version from a given version
          calculate_next_version() {
            local version="$1"
            major=$(echo "$version" | cut -d. -f1)
            minor=$(echo "$version" | cut -d. -f2)
            patch=$(echo "$version" | cut -d. -f3)

            # Rollover at .20 to keep patch numbers manageable (matching pre-commit hook)
            if [ "$patch" -ge 20 ]; then
              new_minor=$((minor + 1))
              echo "$major.$new_minor.0"
            else
              new_patch=$((patch + 1))
              echo "$major.$minor.$new_patch"
            fi
          }

          # Function to check if a version exists in the registry
          version_exists() {
            local version="$1"
            if npm view "${package_name}@${version}" version --registry=https://npm.pkg.github.com 2>/dev/null; then
              return 0  # exists
            else
              return 1  # doesn't exist
            fi
          }

          # Function to bump version, ensuring the new version doesn't exist
          bump_version() {
            local reason="$1"
            echo "$reason"

            local original_version="$current_version"

            # Walk from the registry's latest, not the committed version: CI
            # bumps are published but never committed back, so the committed
            # version only falls behind and this walk used to replay the whole
            # gap one version at a time (tenhands died at attempt 99 of exactly
            # that on 2026-08-05). From latest, one step suffices.
            local latest_published
            latest_published=$(npm view "${package_name}" version --registry=https://npm.pkg.github.com 2>/dev/null || echo "")
            if [ -n "$latest_published" ]; then
              current_version=$(printf '%s\n%s\n' "$current_version" "$latest_published" | sort -V | tail -1)
              echo "Registry latest: $latest_published; walking from $current_version"
            fi
            new_version=$(calculate_next_version "$current_version")

            # Keep bumping until we find a version that doesn't exist
            # Add safety limit to prevent infinite loops
            local max_attempts=10
            local attempts=0
            while version_exists "$new_version"; do
              echo "⚠️  Version $new_version already exists, trying next version..."
              attempts=$((attempts + 1))
              if [ $attempts -ge $max_attempts ]; then
                echo "❌ Error: Reached maximum version bump attempts ($max_attempts)"
                echo "This suggests a systematic issue. Last tried: $new_version"
                exit 1
              fi
              new_version=$(calculate_next_version "$new_version")
            done

            echo "✓ Version $new_version is available"

            # Update package.json with new version
            node -e "const fs = require('fs'); const p = 'package.json'; const src = fs.readFileSync(p, 'utf8'); const next = src.replace(/(\"version\"\s*:\s*\")[^\"]*(\")/, (m, a, b) => a + process.argv[1] + b); if (next === src) { console.error('could not patch version in ' + p); process.exit(1); } fs.writeFileSync(p, next);" "$new_version"

            echo "✅ Version bumped: $original_version → $new_version"

            # Update lock file
            pnpm --config.store-dir=${{ runner.tool_cache }}/pnpm-store install --lockfile-only

            # Update current_version for any subsequent checks
            current_version="$new_version"
          }

          # Check if the version moved ACROSS THIS PUSH, on the same base the
          # code check below uses. These two answers are paired — "code changed
          # and the version did not" is what triggers a bump — so reading them
          # from different ranges makes the pair incoherent on any multi-commit
          # push: a version bumped two commits back would read as not bumped.
          previous_version=$(git show "$BASE:package.json" 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8')).version" 2>/dev/null || echo "")

          if [ -n "$previous_version" ] && [ "$previous_version" != "$current_version" ]; then
            echo "✓ Version was already bumped in this push: $previous_version → $current_version"
            version_was_bumped=true
          else
            echo "ℹ️  Version was not bumped in this push"
            version_was_bumped=false
          fi

          # Check if files that require version bump were changed across this push
          # (matching pre-commit hook logic: src/, package.json, vite.config., tsconfig.)
          echo "Checking if version-bump-triggering files changed across this push..."
          if [ "$PUBLISH_ALL" = "true" ] || git diff --name-only "$BASE" HEAD | grep -q -E "^(src/|vite\.config\.|tsconfig\.)"; then
            echo "⚠️  Code or build config changes detected in this push"
            code_changed=true
          else
            echo "ℹ️  No code or build config changes in this push"
            code_changed=false
          fi

          # Determine if we need to bump
          should_bump=false

          # Case 1: Code changed but version wasn't bumped (pre-commit hook was bypassed)
          if [ "$code_changed" = true ] && [ "$version_was_bumped" = false ]; then
            should_bump=true
            bump_reason="⚠️  Code changed but version was not bumped (pre-commit hook bypassed), bumping now..."
          fi

          # Case 2: Current version already exists in registry
          if [ "$should_bump" = false ]; then
            echo "Checking if version $current_version exists in registry..."
            if version_exists "$current_version"; then
              should_bump=true
              bump_reason="⚠️  Version $current_version already published, bumping version..."
            else
              echo "✓ Version $current_version is not published yet"
            fi
          fi

          # Perform the bump if needed
          if [ "$should_bump" = true ]; then
            bump_version "$bump_reason"
          fi
        env:
          BASE: ${{ steps.range.outputs.base }}
          PUBLISH_ALL: ${{ steps.range.outputs.publish_all }}
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      - name: Publish package
        if: steps.package_changed.outputs.changed == 'true'
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify publish appeared on registry
        if: steps.package_changed.outputs.changed == 'true'
        run: |
          # Defense in depth: pnpm publish does not fail loudly on
          # duplicate-version no-ops in pnpm 9+. Verify the version actually
          # landed on the registry.
          package_name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if ! npm view "${package_name}@${version}" version --registry=https://npm.pkg.github.com 2>/dev/null | grep -q "$version"; then
            echo "❌ ERROR: ${package_name}@${version} did not appear on the registry after publish"
            exit 1
          fi
          echo "✓ Verified ${package_name}@${version} on registry"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      # Notify parent app to update dependencies
      - name: Notify parent about package update
        if: steps.package_changed.outputs.changed == 'true'
        env:
          HADOKU_SITE_TOKEN: ${{ secrets.HADOKU_SITE_TOKEN }}
        run: |
          echo "Notifying hadoku_site about package update..."

          if [ -z "$HADOKU_SITE_TOKEN" ]; then
            echo "⚠️  Warning: HADOKU_SITE_TOKEN not available, skipping notification"
            exit 0
          fi

          payload=$(cat <<EOF
            {
              "event_type": "packages_updated",
              "client_payload": {
                "packages": ["@wolffm/contact-ui"],
                "sha": "${{ github.sha }}",
                "ref": "${{ github.ref }}"
              }
            }
          EOF
          )

          status_code=$(curl -sS \
            -o /dev/null \
            -w "%{http_code}" \
            -X POST "https://api.github.com/repos/WolffM/hadoku_site/dispatches" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $HADOKU_SITE_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$payload")

          if [ "$status_code" = "204" ]; then
            echo "✅ Notified hadoku_site about package update"
          else
            echo "⚠️  Failed to notify hadoku_site (HTTP $status_code)"
          fi

      # A red run is seen by nobody unless it says so itself: nothing polls
      # these repos. `always()` so RECOVERIES report too -- without the success
      # side the alert state stays broken and the next real failure arrives as a
      # suppressed reminder rather than a new alert.
      - name: Report the outcome so a silent failure can't hide
        if: always()
        uses: WolffM/hadoku-actions/report-job@v1
        with:
          job-name: contact-ui:publish
          service-key: ${{ secrets.KEY_SERVICE_CONTACT_UI }}
          started-at: ${{ env.JOB_STARTED_AT }}
